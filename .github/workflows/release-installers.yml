name: Build release installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm verify:release-version

      - name: Require a public update repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh repo view "${GITHUB_REPOSITORY}" --json visibility --jq .visibility)"
          if [[ "${visibility}" != "PUBLIC" ]]; then
            echo "Software updates require a public GitHub release repository. Current visibility: ${visibility}."
            exit 1
          fi

      - name: Require production signing credentials
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          for name in \
            WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
            MAC_CSC_LINK MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Reject an existing release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          release_tag="v${version}"
          if gh release view "${release_tag}" >/dev/null 2>&1 || \
            git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists. Increase both package versions before publishing."
            exit 1
          fi

      - name: Run static and unit checks
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test

      - name: Install Linux Electron dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Run Linux end-to-end tests
        run: xvfb-run --auto-servernum pnpm test:e2e

  package-windows:
    name: Windows x64 signed installer
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows workflows
        run: pnpm test:e2e

      - name: Build signed NSIS installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never --config.forceCodeSigning=true
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Verify packaged application
        run: pnpm verify:package

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $targets = @("release/win-unpacked/Fuxian.exe") + `
            @(Get-ChildItem "release/*-windows-x64-setup.exe" | ForEach-Object FullName)
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $target: $($signature.Status)"
            }
          }

      - name: Smoke-test packaged application
        run: pnpm exec playwright test tests/electron/packaged-app.spec.ts
        env:
          FUXIAN_PACKAGED_EXECUTABLE: release/win-unpacked/Fuxian.exe

      - name: Upload Windows update assets
        uses: actions/upload-artifact@v7
        with:
          name: fuxian-windows-x64
          path: |
            release/*-windows-x64-setup.exe
            release/*-windows-x64-setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

  package-macos:
    name: macOS x64 and arm64 signed installers
    needs: checks
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify macOS workflows
        run: pnpm test:e2e

      - name: Prepare Apple notarization key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/AuthKey.p8', Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))"
          echo "APPLE_API_KEY=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"

      - name: Build signed and notarized macOS artifacts
        run: pnpm exec electron-builder --mac dmg zip --x64 --arm64 --publish never --config.forceCodeSigning=true
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Verify packaged applications
        run: pnpm verify:package

      - name: Verify signatures and notarization tickets
        shell: bash
        run: |
          for app_path in "release/mac/浮现.app" "release/mac-arm64/浮现.app"; do
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            spctl --assess --type execute --verbose=2 "${app_path}"
            xcrun stapler validate "${app_path}"
          done

      - name: Smoke-test packaged Intel application
        run: pnpm exec playwright test tests/electron/packaged-app.spec.ts
        env:
          FUXIAN_PACKAGED_EXECUTABLE: release/mac/浮现.app/Contents/MacOS/浮现

      - name: Smoke-test packaged Apple Silicon application
        run: pnpm exec playwright test tests/electron/packaged-app.spec.ts
        env:
          FUXIAN_PACKAGED_EXECUTABLE: release/mac-arm64/浮现.app/Contents/MacOS/浮现

      - name: Upload macOS update assets
        uses: actions/upload-artifact@v7
        with:
          name: fuxian-macos
          path: |
            release/*-mac-x64.dmg
            release/*-mac-x64.zip
            release/*-mac-x64.zip.blockmap
            release/*-mac-arm64.dmg
            release/*-mac-arm64.zip
            release/*-mac-arm64.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified GitHub Release
    needs:
      - package-windows
      - package-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: release-assets

      - name: Verify updater metadata and artifacts
        run: pnpm verify:update-assets

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "title=浮现 ${version}" >> "${GITHUB_OUTPUT}"

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/* \
            --draft \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}"

      - name: Verify uploaded release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          remote_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[] | [.name, .size] | @tsv')"
          while IFS= read -r local_path; do
            name="$(basename "${local_path}")"
            size="$(stat -c %s "${local_path}")"
            if ! grep -Fqx "${name}"$'\t'"${size}" <<< "${remote_assets}"; then
              echo "Uploaded asset is missing or has the wrong size: ${name}"
              exit 1
            fi
          done < <(find release-assets -maxdepth 1 -type f -print | sort)

      - name: Publish stable release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest
