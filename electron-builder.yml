appId: com.defpeter.fuxian
productName: 浮现
electronVersion: 44.0.0
directories:
  buildResources: build
  output: release
files:
  - apps/desktop/out/**/*
  - apps/desktop/resources/**/*
  - package.json
  - '!node_modules/electron{,/**/*}'
asarUnpack:
  - apps/desktop/resources/**
fileAssociations:
  - ext:
      - md
      - markdown
    name: Markdown 文档
    description: Markdown 源文档
    role: Viewer
win:
  executableName: Fuxian
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: fuxian-${version}-windows-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: fuxian-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip
npmRebuild: false
publish:
  provider: github
  owner: def-peter
  repo: fuxian
