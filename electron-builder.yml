appId: com.defpeter.fuxian
productName: 浮现
electronVersion: 44.0.0
directories:
  buildResources: build
  output: release
afterPack: ./scripts/after-pack.mjs
files:
  - apps/desktop/out/**/*
  - apps/desktop/resources/**/*
  - package.json
  - '!node_modules/electron{,/**/*}'
asarUnpack:
  - apps/desktop/resources/**
win:
  executableName: Fuxian
  icon: build/icon.ico
  fileAssociations:
    - ext:
        - md
        - markdown
      name: Fuxian.Markdown
      description: Markdown 源文档
      icon: markdown-file.ico
  target:
    - nsis
nsis:
  artifactName: fuxian-${version}-windows-${arch}-setup.${ext}
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: fuxian-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  icon: build/icon.icns
  fileAssociations:
    - ext:
        - md
        - markdown
      name: Markdown 文档
      role: Viewer
      icon: markdown-file.icns
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - dmg
    - zip
npmRebuild: false
publish:
  provider: github
  owner: def-peter
  repo: fuxian
