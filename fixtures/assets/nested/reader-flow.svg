  <path d="m420 70 14 10-14 10" fill="none" stroke="#2f7258" stroke-width="2" />
  <rect x="464" y="48" width="216" height="64" rx="3" fill="#ffffff" stroke="#6f9585" />
  <text x="572" y="86" fill="#26332f" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Finished document</text>
