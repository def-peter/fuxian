packages:
  - apps/*
  - packages/*
allowBuilds:
  core-js: false
  electron-winstaller: true
  es5-ext: false
  esbuild: true
overrides:
  # CodeMirror extensions exchange class instances and must share one state/view pair.
  '@codemirror/state': 6.6.0
  '@codemirror/view': 6.42.1
minimumReleaseAgeExclude:
  - eslint-plugin-react-refresh@0.5.5
